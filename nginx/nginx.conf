events {}

http {
    server {
        listen 80;

        # Analyst REST API (internal/api): alert triage, notes, reports, assets.
        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            proxy_pass http://api:8080/health;
        }

        # Grafana dashboards. GF_SERVER_SERVE_FROM_SUB_PATH=true in
        # docker-compose.yml expects to be reached under this same /grafana/
        # prefix.
        location /grafana/ {
            proxy_pass http://grafana:3000/grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            return 302 /grafana/;
        }
    }
}
